<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PlaceRate — Creating Vibrant Communities</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      CHC (chc.com.au) sets headings in Flama and body copy in Aleo/Lyon Text.
      Flama and Lyon Text are licensed, self-hosted faces we cannot redistribute,
      so Archivo stands in for Flama (same squarish humanist grotesque, weights
      200-900). Aleo is the genuine CHC face and is SIL OFL, so it is used as-is.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;400;500;600;700;800;900&family=Aleo:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Google Maps API for address autocomplete -->
    <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA2hKgFjXsh-uLXn90vs5VjsuaoLFAFzDw&libraries=places"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
